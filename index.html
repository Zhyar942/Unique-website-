<head>

  <style>
    body.is-loading, body.is-docking { overflow: hidden; }
    .startup-loader { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; isolation: isolate; pointer-events: auto; }
    
    /* Architectural Packaging / Cabinet Shutters */
    .startup-shutter {
      position: absolute;
      left: 0;
      right: 0;
      height: 50vh;
      background: #faf8f5;
      z-index: 1;
      will-change: transform;
      transform: translateZ(0);
      transition: transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .startup-shutter-top {
      top: 0;
      transform-origin: top center;
    }
    .startup-shutter-bottom {
      bottom: 0;
      transform-origin: bottom center;
    }
    .startup-crease {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(140, 115, 85, 0.15) 25%, rgba(255, 102, 0, 0.3) 50%, rgba(140, 115, 85, 0.15) 75%, transparent 95%);
      z-index: 0;
      transform: translateY(-50%);
      transition: opacity 350ms ease;
      pointer-events: none;
    }

    .startup-loader.is-docking .startup-shutter-top {
      transform: translateY(-100%);
    }
    .startup-loader.is-docking .startup-shutter-bottom {
      transform: translateY(100%);
    }
    .startup-loader.is-docking .startup-crease {
      opacity: 0;
    }

    body.is-loading .header-logo-link,
    body.is-docking:not(.is-leaving) .header-logo-link,
    body:has(.startup-loader:not(.is-leaving)) .header-logo-link {
      visibility: hidden;
    }
    .startup-loader.is-leaving {
      opacity: 0;
      pointer-events: none;
      transition: opacity 380ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .startup-loader-inner {
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
    }

    /* Minimalist Packaging Frame around Logo with ambient radial glow */
    .startup-pack-box {
      position: relative;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: radial-gradient(circle at center, rgba(255, 102, 0, 0.04) 0%, rgba(250, 248, 245, 0) 70%);
      transition: opacity 400ms ease;
    }
    .startup-pack-box::before,
    .startup-pack-box::after {
      display: none;
    }

    /* High-Performance GPU Composited Logo System */
    .startup-logo {
      position: relative;
      width: clamp(170px, 24vw, 240px);
      aspect-ratio: 4072.9774 / 1288.0952;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      animation: logo-arrive 650ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes logo-arrive {
      0% {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .startup-symbol-layer,
    .startup-text-mask,
    .startup-text-layer,
    .startup-letter {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .startup-symbol-layer {
      z-index: 2;
      will-change: transform, opacity;
      transform: translateZ(0);
      opacity: 1;
    }

    .startup-text-mask {
      z-index: 1;
      overflow: hidden;
      clip-path: inset(-10% -10% -10% 25.4%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 24.8%, rgba(0,0,0,0.85) 25.8%, black 27%, black 100%);
      mask-image: linear-gradient(to right, transparent 0%, transparent 24.8%, rgba(0,0,0,0.85) 25.8%, black 27%, black 100%);
    }
    .startup-text-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* All letters rest naturally in place at start — no animation coming out of U at start */
    .startup-letter {
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      backface-visibility: hidden;
    }

    /* Staggered Silky Folding into the 'U' emblem (Ultra Smooth, Friction-Damped Deceleration) */
    .startup-loader.is-packing .startup-letter,
    .startup-loader.is-docking .startup-letter {
      opacity: 0;
      pointer-events: none;
    }

    .startup-loader.is-packing .letter-sub,
    .startup-loader.is-docking .letter-sub {
      animation: letter-sub-into-u 560ms cubic-bezier(0.22, 1, 0.36, 1) 0ms forwards;
    }
    .startup-loader.is-packing .letter-e,
    .startup-loader.is-docking .letter-e {
      animation: letter-e-into-u 560ms cubic-bezier(0.22, 1, 0.36, 1) 45ms forwards;
    }
    .startup-loader.is-packing .letter-u,
    .startup-loader.is-docking .letter-u {
      animation: letter-u-into-u 560ms cubic-bezier(0.22, 1, 0.36, 1) 90ms forwards;
    }
    .startup-loader.is-packing .letter-q,
    .startup-loader.is-docking .letter-q {
      animation: letter-q-into-u 560ms cubic-bezier(0.22, 1, 0.36, 1) 135ms forwards;
    }
    .startup-loader.is-packing .letter-i,
    .startup-loader.is-docking .letter-i {
      animation: letter-i-into-u 560ms cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
    }
    .startup-loader.is-packing .letter-n,
    .startup-loader.is-docking .letter-n {
      animation: letter-n-into-u 580ms cubic-bezier(0.22, 1, 0.36, 1) 225ms forwards;
    }

    @keyframes letter-sub-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-46%, 0, 0);
      }
    }
    @keyframes letter-e-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-68%, 0, 0);
      }
    }
    @keyframes letter-u-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-60%, 0, 0);
      }
    }
    @keyframes letter-q-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-52%, 0, 0);
      }
    }
    @keyframes letter-i-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-44%, 0, 0);
      }
    }
    @keyframes letter-n-into-u {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      50% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translate3d(-36%, 0, 0);
      }
    }

    /* 4. Top Header Docking: each letter of "nique" emerges in a silky, staggered cascade out of the 'U' */
    .startup-loader.is-docking.is-settling .letter-n,
    .startup-loader.is-settling .letter-n {
      animation: letter-n-out 800ms cubic-bezier(0.16, 1, 0.3, 1) 0ms forwards;
    }
    .startup-loader.is-docking.is-settling .letter-i,
    .startup-loader.is-settling .letter-i {
      animation: letter-i-out 800ms cubic-bezier(0.16, 1, 0.3, 1) 50ms forwards;
    }
    .startup-loader.is-docking.is-settling .letter-q,
    .startup-loader.is-settling .letter-q {
      animation: letter-q-out 800ms cubic-bezier(0.16, 1, 0.3, 1) 100ms forwards;
    }
    .startup-loader.is-docking.is-settling .letter-u,
    .startup-loader.is-settling .letter-u {
      animation: letter-u-out 800ms cubic-bezier(0.16, 1, 0.3, 1) 150ms forwards;
    }
    .startup-loader.is-docking.is-settling .letter-e,
    .startup-loader.is-settling .letter-e {
      animation: letter-e-out 800ms cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
    }
    .startup-loader.is-docking.is-settling .letter-sub,
    .startup-loader.is-settling .letter-sub {
      animation: letter-sub-out 760ms cubic-bezier(0.16, 1, 0.3, 1) 250ms forwards;
    }

    @keyframes letter-n-out {
      0% {
        opacity: 0;
        transform: translate3d(-36%, 0, 0);
      }
      40% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes letter-i-out {
      0% {
        opacity: 0;
        transform: translate3d(-44%, 0, 0);
      }
      40% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes letter-q-out {
      0% {
        opacity: 0;
        transform: translate3d(-52%, 0, 0);
      }
      40% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes letter-u-out {
      0% {
        opacity: 0;
        transform: translate3d(-60%, 0, 0);
      }
      40% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes letter-e-out {
      0% {
        opacity: 0;
        transform: translate3d(-68%, 0, 0);
      }
      40% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes letter-sub-out {
      0% {
        opacity: 0;
        transform: translate3d(-45%, 3px, 0);
      }
      40% {
        opacity: 0.6;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .startup-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-shutter, .startup-pack-box::before, .startup-pack-box::after,
      .startup-symbol-layer, .startup-text-layer, .startup-letter {
        animation: none !important;
        transition: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }
  </style>
